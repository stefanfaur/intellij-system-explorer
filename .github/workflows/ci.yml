name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: build/reports/tests/test/
          retention-days: 30

      - name: Run light tests
        run: ./gradlew testIdeUi --tests "ro.faur.explorer.light.*" --no-daemon --stacktrace

      - name: Upload light test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-test-reports
          path: build/reports/tests/testIdeUi/
          retention-days: 30

      - name: Run heavy tests
        run: ./gradlew testIdeUi --tests "ro.faur.explorer.heavy.*" --no-daemon --stacktrace

      - name: Upload heavy test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-test-reports
          path: build/reports/tests/testIdeUi/
          retention-days: 30

      - name: Setup Xvfb for UI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Run UI tests
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          ./gradlew testUi --no-daemon --stacktrace

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: build/reports/tests/testUi/
          retention-days: 30
