name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build-natives:
    name: Build Native (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            lib: libfuzzyjni.so
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            lib: libfuzzyjni.dylib
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            lib: libfuzzyjni.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x86_64
            lib: fuzzyjni.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Add cross-compile target
        run: rustup target add ${{ matrix.target }}
      - name: Build native lib
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: rust-fuzzy
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: rust-fuzzy/target/${{ matrix.target }}/release/${{ matrix.lib }}

  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: build/reports/tests/test/
          retention-days: 30

      - name: Setup Xvfb for IDE/UI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Run light tests
        run: xvfb-run -a ./gradlew test -PincludeIdeTests=true --tests "ro.faur.explorer.light.*" --no-daemon --stacktrace

      - name: Upload light test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-test-reports
          path: build/reports/tests/test/
          retention-days: 30

      - name: Run heavy tests
        run: xvfb-run -a ./gradlew test -PincludeIdeTests=true --tests "ro.faur.explorer.heavy.*" --no-daemon --stacktrace

      - name: Upload heavy test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-test-reports
          path: build/reports/tests/test/
          retention-days: 30

  verify:
    name: Plugin Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify plugin
        run: ./gradlew verifyPlugin --no-daemon --stacktrace

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verifier-reports
          path: build/reports/pluginVerifier/
          retention-days: 30

  sftp-integration-tests:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Xvfb for IDE/UI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Run embedded SSH server tests
        run: ./gradlew test -PincludeSftpTests=true --tests "ro.faur.explorer.sftp.*" --no-daemon --stacktrace

      - name: Upload SFTP integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sftp-integration-reports
          path: build/reports/tests/test/
          retention-days: 30

      - name: Run remote light platform tests
        run: xvfb-run -a ./gradlew test -PincludeIdeTests=true --tests "ro.faur.explorer.light.remote.*" --no-daemon --stacktrace

      - name: Upload SFTP light test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sftp-light-reports
          path: build/reports/tests/test/
          retention-days: 30

      - name: Run remote heavy platform tests
        run: xvfb-run -a ./gradlew test -PincludeIdeTests=true --tests "ro.faur.explorer.heavy.remote.*" --no-daemon --stacktrace

      - name: Upload SFTP heavy test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sftp-heavy-reports
          path: build/reports/tests/test/
          retention-days: 30

  snapshot:
    name: Build Snapshot
    runs-on: ubuntu-latest
    needs: [verify, build-natives]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-libs/

      - name: Place native libs in resources
        run: |
          for dir in native-libs/native-*/; do
            platform=$(basename "$dir" | sed 's/native-//')
            mkdir -p src/main/resources/natives/$platform
            cp "$dir"* src/main/resources/natives/$platform/
          done

      - name: Calculate snapshot version
        id: version
        run: |
          CURRENT_VERSION=$(grep "^pluginVersion = " gradle.properties | cut -d'=' -f2 | tr -d ' ')
          SNAPSHOT_VERSION="${CURRENT_VERSION}-build.${{ github.run_number }}"
          echo "snapshot_version=$SNAPSHOT_VERSION" >> $GITHUB_OUTPUT
          echo "Building snapshot version: $SNAPSHOT_VERSION"

      - name: Update version temporarily
        run: |
          ./.github/scripts/update-version.sh "${{ steps.version.outputs.snapshot_version }}"

      - name: Build plugin
        run: ./gradlew buildPlugin -PskipCargo=true --no-daemon --stacktrace

      - name: Create snapshot pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot-build.${{ github.run_number }}
          name: Snapshot ${{ steps.version.outputs.snapshot_version }}
          body: |
            Automated snapshot build from main branch.

            **Version:** `${{ steps.version.outputs.snapshot_version }}`
            **Commit:** `${{ github.sha }}`

            Install: Settings → Plugins → ⚙️ → Install Plugin from Disk…
          files: build/distributions/*.zip
          prerelease: true

      - name: Cleanup old snapshot releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("snapshot-build."))) | .tagName' \
            | tail -n +6 \
            | xargs -I {} gh release delete {} --yes --cleanup-tag

  release:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    needs: [verify, build-natives]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-libs/

      - name: Place native libs in resources
        run: |
          for dir in native-libs/native-*/; do
            platform=$(basename "$dir" | sed 's/native-//')
            mkdir -p src/main/resources/natives/$platform
            cp "$dir"* src/main/resources/natives/$platform/
          done

      - name: Set version from tag
        run: ./.github/scripts/update-version.sh "${GITHUB_REF_NAME#v}"

      - name: Publish plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin -PskipCargo=true --no-daemon --stacktrace

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*-signed.zip
