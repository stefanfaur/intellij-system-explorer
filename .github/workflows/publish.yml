name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.1)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve version from input or tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Extract from tag (remove 'v' prefix)
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    needs: resolve-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format. Expected X.Y.Z, got: $VERSION"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Check CHANGELOG.md exists
        run: |
          if [ ! -f "CHANGELOG.md" ]; then
            echo "Error: CHANGELOG.md not found"
            exit 1
          fi

      - name: Validate changelog entry exists
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "Error: No changelog entry found for version $VERSION"
            echo "Please add a section in CHANGELOG.md: ## [$VERSION] - $(date +%Y-%m-%d)"
            exit 1
          fi
          echo "Changelog entry found for $VERSION"

      - name: Extract changelog
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          ./.github/scripts/extract-changelog.sh "$VERSION" changelog-entry.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog-entry
          path: changelog-entry.md
          retention-days: 1

      - name: Check tag doesn't exist
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Error: Tag v$VERSION already exists"
            exit 1
          fi
          echo "Tag v$VERSION does not exist, ok to proceed"

  test-all:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: resolve-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0

      - name: Run all tests
        run: |
          ./gradlew test --no-daemon --stacktrace
          xvfb-run -a ./gradlew test -PincludeIdeTests=true --tests "ro.faur.explorer.light.*" --no-daemon --stacktrace
          xvfb-run -a ./gradlew test -PincludeIdeTests=true --tests "ro.faur.explorer.heavy.*" --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-test-reports
          path: build/reports/tests/
          retention-days: 30

  verify-all:
    name: Comprehensive Verification
    runs-on: ubuntu-latest
    needs: test-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify plugin
        run: ./gradlew verifyPlugin --no-daemon --stacktrace

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-verifier-reports
          path: build/reports/pluginVerifier/
          retention-days: 30

  approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    needs: [resolve-version, validate, test-all, verify-all]
    environment: production

    steps:
      - name: Wait for approval
        run: |
          echo "Release version: ${{ needs.resolve-version.outputs.version }}"
          echo "All validations passed. Awaiting manual approval..."
          echo ""
          echo "Review:"
          echo "- Test results: Check 'test-all' job"
          echo "- Verifier reports: Check 'verify-all' artifacts"
          echo "- Changelog: Check 'validate' artifacts"

  release:
    name: Release Execution
    runs-on: ubuntu-latest
    needs: [resolve-version, approval]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update version
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          ./.github/scripts/update-version.sh "$VERSION"
          git add gradle.properties
          git diff --cached --quiet && echo "Version already set to $VERSION, nothing to commit" || {
            git commit -m "chore: release version $VERSION"
            git push
          }

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon --stacktrace
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog-entry

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin --no-daemon --stacktrace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

      - name: Create and push tag
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # Create annotated tag with changelog excerpt
          git tag -a "v$VERSION" -F changelog-entry.md
          git push origin "v$VERSION"

      - name: Bump to next snapshot version
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          NEXT_VERSION=$(./.github/scripts/next-version.sh "$VERSION")
          echo "Bumping version to $NEXT_VERSION"
          ./.github/scripts/update-version.sh "$NEXT_VERSION"
          git add gradle.properties
          git commit -m "chore: bump version to $NEXT_VERSION"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: Release ${{ needs.resolve-version.outputs.version }}
          body_path: changelog-entry.md
          files: build/distributions/*.zip
          draft: false
          prerelease: false
